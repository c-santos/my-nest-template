services:
    my-template:
        build: .
        ports:
            - $PORT:$PORT
        volumes:
            - .:/my-template/
        environment:
            - PORT=$PORT
            - NODE_ENV=$NODE_ENV
        command: npm run start:dev
        depends_on:
            - template-db
        networks:
            - template-network

    template-db:
        container_name: template-db
        image: postgres
        ports:
            - $DB_PORT:5432 # CONTAINER:HOST
        environment:
            POSTGRES_PASSWORD: $DB_PASS
            POSTGRES_DB: $DB_NAME
        networks:
            - template-network

networks:
    template-network:
